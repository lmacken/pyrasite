name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    # Pin the image: ubuntu-latest is 26.04, which has no setup-python build
    # for Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install gdb and relax ptrace restrictions
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Install pyrasite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lint
        run: uvx --from ruff==0.17.4 ruff check .

      - name: Check formatting
        run: uvx --from ruff==0.17.4 ruff format --check .

  docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'
          sphinx-build -W -b html docs docs/_build/html

  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  cross-interpreter:
    name: Inject across interpreters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install gdb and relax ptrace restrictions
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Install all supported interpreters
        run: uv python install 3.9 3.10 3.11 3.12 3.13 3.14 3.15

      - name: Create test environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[test]'

      - name: Inject into every interpreter
        run: |
          INTERPRETERS=$(for v in 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            uv python find "$v"
          done | paste -sd: -)
          echo "Testing: $INTERPRETERS"
          PYRASITE_TEST_INTERPRETERS="$INTERPRETERS" \
            .venv/bin/pytest -q pyrasite/tests/test_code_injection.py
