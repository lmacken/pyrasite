[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrasite"
dynamic = ["version"]
description = "Inject code into a running Python process"
readme = "README.rst"
requires-python = ">=3.9"
authors = [
    {name = "Luke Macken", email = "lmacken@redhat.com"},
]
keywords = ["debugging", "injection", "runtime"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
memory-viewer = ["urwid>=2.0", "meliae"]
test = ["pytest>=7", "pytest-cov"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.17,<0.18", "sphinx>=7", "build>=1.2"]
docs = ["sphinx>=7"]

[project.urls]
Homepage = "https://github.com/lmacken/pyrasite"
Documentation = "https://pyrasite.readthedocs.io"
Source = "https://github.com/lmacken/pyrasite"
Changelog = "https://github.com/lmacken/pyrasite/blob/develop/CHANGELOG.rst"

[project.scripts]
pyrasite = "pyrasite.main:main"
pyrasite-memory-viewer = "pyrasite.tools.memory_viewer:main"
pyrasite-shell = "pyrasite.tools.shell:shell"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "pyrasite.__version__"}

[tool.setuptools.packages.find]
include = ["pyrasite*"]

[tool.setuptools.package-data]
pyrasite = ["win/*"]

[tool.pytest.ini_options]
testpaths = ["pyrasite/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["pyrasite"]
omit = ["pyrasite/payloads/*", "pyrasite/tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# Percent formatting is still idiomatic for the generated bootstrap code and
# for log-style messages, so it is not converted wholesale to f-strings.
ignore = ["UP031"]
