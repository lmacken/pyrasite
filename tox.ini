# Tox configuration.  tox-uv is used so that missing interpreters are
# downloaded automatically with uv.  Run `tox` to test every supported
# version, or `tox -e py312` for a single one.
#
# You can also run the suite in the current environment with `pytest`.

[tox]
envlist = py39,py310,py311,py312,py313,py314,py315,lint
requires =
    tox>=4
    tox-uv>=1.0
skip_missing_interpreters = true

[testenv]
package = wheel
deps =
    pytest
passenv =
    PYRASITE_TEST_INTERPRETERS
commands = pytest {posargs}

[testenv:lint]
skip_install = true
deps = ruff>=0.17,<0.18
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
deps = sphinx>=7
commands = sphinx-build -W -b html docs {toxworkdir}/docs/html
